name: VoiceCalendarReminders
options:
  bundleIdPrefix: com.voicecalendar
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VoiceCalendarReminders:
    type: application
    platform: iOS
    sources:
      - path: VoiceCalendarReminders
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicecalendar.app
        INFOPLIST_FILE: VoiceCalendarReminders/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceCalendarReminders/VoiceCalendarReminders.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: VoiceCalendarReminders/VoiceCalendarReminders.entitlements
